[package]
name = "idraaak-image-fit"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Checked integer geometry for aspect-ratio-preserving contain and centered cover image layouts"
license = "MIT"
homepage = "https://idraaak.com/"
repository = "https://github.com/nedal-dev/idraaak-image-fit"
readme = "README.md"
keywords = ["image", "resize", "aspect-ratio", "crop", "geometry"]
categories = ["multimedia::images", "mathematics"]
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE", "CHANGELOG.md"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

