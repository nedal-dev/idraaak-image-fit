name: Clojure image geometry

on:
  push:
    paths:
      - 'clojure/**'
      - 'doc/cljdoc.edn'
      - '.github/workflows/clojure-image-fit.yml'
  pull_request:
    paths:
      - 'clojure/**'
      - 'doc/cljdoc.edn'
      - '.github/workflows/clojure-image-fit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clojure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Leiningen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y leiningen
      - name: Test on the JVM
        run: lein run -m idraaak.jvm-test-runner
      - name: Compile ClojureScript tests
        run: lein with-profile +cljs run -m cljs.main -O simple -t node -o target/cljs-tests.js -c idraaak.cljs-test-runner
      - name: Test in Node.js
        run: node target/cljs-tests.js
      - name: Build release files
        run: |
          lein with-profile -dev jar
          lein with-profile -dev pom
      - uses: actions/upload-artifact@v4
        with:
          name: clojure-image-fit-0.1.0
          path: |
            clojure/target/idraaak-image-fit-0.1.0.jar
            clojure/pom.xml
          if-no-files-found: error
